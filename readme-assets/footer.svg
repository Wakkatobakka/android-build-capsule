<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230" role="img" aria-label="Give chat hands. A capsule splits open and light spills out.">
<title>Give chat hands. A capsule splits open and light spills out.</title>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.ep{animation:ep 6s linear infinite}@keyframes ep{0%,93%,100%{opacity:1}94%{opacity:.3}95%{opacity:1}97%{opacity:.5}98%{opacity:1}}
</style>
<defs>
<filter id="gl" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="sc" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" opacity=".03"/></pattern>
</defs>
<rect x="1" y="1" width="898" height="228" rx="16" fill="#0c1219" stroke="#223140" stroke-width="2"/>
<defs><linearGradient id="bm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffa23d" stop-opacity=".45"/><stop offset="1" stop-color="#ffa23d" stop-opacity="0"/></linearGradient></defs>
<polygon points="438,76 462,76 520,168 380,168" fill="url(#bm)"><animate attributeName="opacity" values=".5;1;.5" dur="4s" repeatCount="indefinite"/></polygon>
<g transform="translate(450,74) scale(2.2)">
<g><animateTransform attributeName="transform" type="translate" values="-4,0;-9,0;-4,0" dur="4s" repeatCount="indefinite"/><path d="M-4,-14 H-44 A14,14 0 0 0 -44,14 H-4 Z" fill="#ffa23d"/></g>
<g><animateTransform attributeName="transform" type="translate" values="4,0;9,0;4,0" dur="4s" repeatCount="indefinite"/><path d="M4,-14 H44 A14,14 0 0 1 44,14 H4 Z" fill="#4fd8f0"/></g>
</g>
<text class="ep" x="450" y="190" font-size="34" font-weight="700" text-anchor="middle" fill="#ffa23d" filter="url(#gl)">Give chat hands.</text>
<text x="450" y="214" font-size="11" fill="#7f93a8" text-anchor="middle">Open the capsule. Hand chat the tools.</text>
</svg>