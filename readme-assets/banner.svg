<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="Android Build Capsule: a chat with code execution receives a capsule, builds with it, and hands back a signed APK">
<title>Android Build Capsule: a chat with code execution receives a capsule, builds with it, and hands back a signed APK</title>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.hg{animation:flick 5s linear infinite}
@keyframes flick{0%,92%,100%{opacity:1}93%{opacity:.35}95%{opacity:1}97%{opacity:.55}98%{opacity:1}}
.cur{animation:cur 1s steps(1) infinite}@keyframes cur{50%{opacity:0}}
.mq{animation:mq 14s linear infinite}@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-560px)}}
</style>
<defs>
<filter id="gl" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="sc" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" opacity=".03"/></pattern>
</defs>
<rect x="1" y="1" width="898" height="338" rx="16" fill="#0c1219" stroke="#223140" stroke-width="2"/>
<rect x="1" y="1" width="898" height="338" rx="16" fill="url(#sc)"/>
<text x="40" y="44" font-size="12" fill="#7f93a8">WAKKA lab / public core</text>
<text x="40" y="98" font-size="44" font-weight="700" fill="#e6eef6">Android Build Capsule</text>
<text class="hg" x="40" y="138" font-size="26" font-weight="700" fill="#ffa23d" filter="url(#gl)">Give chat hands.</text>
<text x="40" y="166" font-size="13" fill="#7f93a8">Android build tools for chats with code execution.</text>
<rect x="40" y="188" width="112" height="56" rx="10" fill="#101a24" stroke="#223140" stroke-width="2"/>
<text x="54" y="216" font-size="21" font-weight="700" fill="#ffa23d">v0.1</text>
<text x="54" y="234" font-size="11" fill="#7f93a8">public core</text>
<rect x="162" y="188" width="112" height="56" rx="10" fill="#101a24" stroke="#223140" stroke-width="2"/>
<text x="176" y="216" font-size="21" font-weight="700" fill="#ffa23d">API 35</text>
<text x="176" y="234" font-size="11" fill="#7f93a8">platform</text>
<rect x="284" y="188" width="112" height="56" rx="10" fill="#101a24" stroke="#223140" stroke-width="2"/>
<text x="298" y="216" font-size="21" font-weight="700" fill="#ffa23d">35.0.0</text>
<text x="298" y="234" font-size="11" fill="#7f93a8">build tools</text>
<rect x="406" y="188" width="112" height="56" rx="10" fill="#101a24" stroke="#223140" stroke-width="2"/>
<text x="420" y="216" font-size="21" font-weight="700" fill="#ffa23d">MIT</text>
<text x="420" y="234" font-size="11" fill="#7f93a8">license</text>
<text x="40" y="270" font-size="11" fill="#7f93a8">Execution host: Linux x86_64, Python 3.10+, JDK 17+</text>
<clipPath id="mq"><rect x="20" y="294" width="520" height="26"/></clipPath>
<rect x="20" y="294" width="520" height="26" rx="6" fill="#101a24"/>
<g clip-path="url(#mq)"><text class="mq" x="20" y="311" font-size="12" fill="#7f93a8" textLength="2240" lengthAdjust="spacing" xml:space="preserve">Share the public core // keep SDK runtimes and signing keys private //   Share the public core // keep SDK runtimes and signing keys private //   Share the public core // keep SDK runtimes and signing keys private //   Share the public core // keep SDK runtimes and signing keys private //   </text></g>
<rect x="600" y="56" width="256" height="122" rx="18" fill="#101a24" stroke="#223140" stroke-width="2"/>
<text x="620" y="82" font-size="11" fill="#7f93a8">chat + code execution</text>
<text x="620" y="110" font-size="12" fill="#4fd8f0">$ read AI_START_HERE.txt</text>
<text x="620" y="134" font-size="12" fill="#e6eef6">$ python3 abc.py build</text>
<rect class="cur" x="780" y="124" width="8" height="12" fill="#43e68a"/>
<text x="620" y="160" font-size="11" fill="#43e68a">signed APK + build evidence</text>
<line id="la" x1="662" y1="178" x2="698" y2="224" stroke="#4fd8f0" stroke-width="8" stroke-linecap="round"><animate attributeName="x2" values="674;674;698;698;674;674" keyTimes="0;.3;.4;.85;.95;1" dur="8s" repeatCount="indefinite"/></line>
<line x1="794" y1="178" x2="752" y2="224" stroke="#4fd8f0" stroke-width="8" stroke-linecap="round"><animate attributeName="x2" values="776;776;752;752;776;776" keyTimes="0;.3;.4;.85;.95;1" dur="8s" repeatCount="indefinite"/></line>
<circle cx="698" cy="224" r="9" fill="#4fd8f0"><animate attributeName="cx" values="674;674;698;698;674;674" keyTimes="0;.3;.4;.85;.95;1" dur="8s" repeatCount="indefinite"/></circle>
<circle cx="752" cy="224" r="9" fill="#4fd8f0"><animate attributeName="cx" values="776;776;752;752;776;776" keyTimes="0;.3;.4;.85;.95;1" dur="8s" repeatCount="indefinite"/></circle>
<g transform="translate(725,224)" filter="url(#gl)">
<animateMotion path="M-160,-182 L0,0" keyPoints="0;1;1" keyTimes="0;.3;1" calcMode="linear" dur="8s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="1;1;1;0;0;1" keyTimes="0;.3;.55;.62;.99;1" dur="8s" repeatCount="indefinite"/>
<path d="M0,-9 H-15 A9,9 0 0 0 -15,9 H0 Z" fill="#ffa23d"/><path d="M0,-9 H15 A9,9 0 0 1 15,9 H0 Z" fill="#4fd8f0"/><line x1="0" y1="-9" x2="0" y2="9" stroke="#0c1219" stroke-width="1.5"/></g>
<g transform="translate(725,284)"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.6;.7;.9;1" dur="8s" repeatCount="indefinite"/>
<rect x="-26" y="-18" width="52" height="36" rx="8" fill="#43e68a"/><text x="0" y="6" font-size="16" font-weight="700" text-anchor="middle" fill="#0c1219">APK</text></g>

